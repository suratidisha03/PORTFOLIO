<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#E2E9EF"/>

  <line x1="120" y1="480" x2="1080" y2="480" stroke="#17243D" stroke-width="1" opacity="0.25"/>

  <!-- stage 1: add to cart -->
  <rect x="150" y="160" width="140" height="320" fill="#17243D"/>
  <text x="220" y="140" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1" fill="#17243D">ADD TO CART</text>
  <text x="220" y="510" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" fill="#526C91">15,132 sessions</text>

  <!-- connector 1: big drop, terracotta -->
  <line x1="290" y1="180" x2="530" y2="326" stroke="#C66543" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="410" y="235" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700" font-size="15" fill="#C66543">-51.8%</text>

  <!-- stage 2: checkout -->
  <rect x="530" y="326" width="140" height="154" fill="#526C91"/>
  <text x="600" y="140" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1" fill="#17243D">CHECKOUT</text>
  <text x="600" y="510" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" fill="#526C91">48.2% of cart adds</text>

  <!-- connector 2: smaller drop -->
  <line x1="670" y1="340" x2="910" y2="386" stroke="#17243D" stroke-width="1" opacity="0.4" stroke-dasharray="3 5"/>
  <text x="790" y="345" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700" font-size="14" fill="#17243D">-18.8%</text>

  <!-- stage 3: purchase -->
  <rect x="910" y="386" width="140" height="94" fill="#17243D"/>
  <text x="980" y="140" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1" fill="#17243D">PURCHASE</text>
  <text x="980" y="510" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" fill="#526C91">29.4% of cart adds</text>

  <text x="120" y="560" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#17243D">PURCHASE FUNNEL</text>
  <text x="1080" y="560" text-anchor="end" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" letter-spacing="1.2" fill="#526C91">GOOGLE MERCHANDISE STORE &#183; NOV 2020&#8211;JAN 2021</text>
</svg>
