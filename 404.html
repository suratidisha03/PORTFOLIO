<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Disha Surati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }
  .notfound .label { margin-bottom: 1rem; }
  .notfound h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(3rem, 10vw, 6rem);
    color: var(--oxblood);
    line-height: 1;
    margin-bottom: 1rem;
  }
  .notfound p { color: var(--text-soft); max-width: 420px; margin-bottom: 2rem; }
  .notfound a { text-decoration: none; color: var(--text); font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
</style>
</head>
<body>
  <div class="notfound">
    <span class="label olive">Data point not found</span>
    <h1>404</h1>
    <p>This page didn't make it into the reporting. Let's get you back to something measurable.</p>
    <a href="/PORTFOLIO/">Back to the homepage</a>
  </div>
</body>
</html>
